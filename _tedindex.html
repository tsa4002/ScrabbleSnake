<!-- Replace the existing .multi-bottom-controls footer in index.html with this.
     It preserves the existing button IDs and JavaScript behavior. -->
<footer class="multi-bottom-controls">
  <div class="game-controls">
    <button id="multiHomeIconButton" class="control-button" type="button"
      title="Home" aria-label="Return to game mode selection">
      <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-7h6v7"/></svg>
    </button>
    <button id="multiMuteButton" class="control-button" type="button"
      title="Mute sound" aria-label="Mute sound">
      <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
    </button>
    <button id="multiPauseButton" class="control-button" type="button"
      title="Pause game" aria-label="Pause game" disabled>
      <svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
    </button>
    <button id="multiResetButton" class="control-button" type="button"
      title="Restart match" aria-label="Restart match">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>
</footer>
