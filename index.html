<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrabble Snake</title>
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/mode-selection.css" />
  <link rel="icon" href="favicon.png" />
</head>
<body>
<main class="mode-screen" id="modeScreen">
<canvas aria-hidden="true" id="homeSnakeCanvas"></canvas>
<div class="mode-card">
<div aria-label="Scrabble Snake" aria-level="1" class="title-tile-wrapper mode-logo" role="heading">
<div class="title-line">
<span class="title-tile" style="background-color:#ffe6a8; transform:rotate(-8deg);">S</span>
<span class="title-tile" style="background-color:#ffe6a8; transform:rotate(6deg);">C</span>
<span class="title-tile" style="background-color:#ffe6a8; transform:rotate(-4deg);">R</span>
<span class="title-tile" style="background-color:#ffe6a8; transform:rotate(5deg);">A</span>
<span class="title-tile" style="background-color:#ffe6a8; transform:rotate(-5deg);">B</span>
<span class="title-tile" style="background-color:#ffe6a8; transform:rotate(4deg);">B</span>
<span class="title-tile" style="background-color:#ffe6a8; transform:rotate(-6deg);">L</span>
<span class="title-tile" style="background-color:#ffe6a8; transform:rotate(8deg);">E</span>
</div>
<div class="title-line indent">
<span class="title-tile" style="background-color:#D2AFB5;">S</span>
<span class="title-tile" style="background-color:#B6CBCC;">N</span>
<span class="title-tile" style="background-color:#ffe6a8;">A</span>
<span class="title-tile" style="background-color:#D8D5C2;">K</span>
<span class="title-tile" style="background-color:#05A4CB;">E</span>
</div>
</div>
<div class="mode-options">
<a class="mode-option" href="word-challenges.html" id="singleModeButton">
<span class="mode-option-title">Word Challenges</span>
<span class="mode-option-description">Three-heart word game</span>
</a>
<a class="mode-option" href="single-player.html" id="soloArenaModeButton">
<span class="mode-option-title">Single Player</span>
<span class="mode-option-description">Go against a bot!</span>
</a>
<a class="mode-option" href="double-player.html" id="multiModeButton">
<span class="mode-option-title">Double Player</span>
<span class="mode-option-description">Play a friend!</span>
</a>
</div>
</div>
</main>
  <script src="js/home-animation.js"></script>
</body>
</html>
